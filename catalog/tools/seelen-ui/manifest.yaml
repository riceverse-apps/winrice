id: seelen-ui
name: "Seelen UI"
category: shell-mod
summary:
  en: "Full desktop environment: top bar, dock, launcher and tiling."
  pt-BR: "Ambiente de desktop completo: barra no topo, dock, lançador e mosaico."
difficulty: intermediate
homepage: https://github.com/eythaann/Seelen-UI
license: "AGPL-3.0"
requires:
  windows_min_build: 22000
  windows_max_build: null
  admin: false
install:
  method: winget
  id: Seelen.SeelenUI
uninstall:
  method: winget
detect:
  process: seelen-ui.exe
  # MSIX package: found through the package registration, not through a file path.
  appx: [Seelen.SeelenUI]
  # Execution aliases of the package; slu-service is what keeps the UI alive (see deactivate).
  paths:
    - '%LOCALAPPDATA%\Microsoft\WindowsApps\slu-service.exe'
    - '%LOCALAPPDATA%\Microsoft\WindowsApps\slu.exe'
activate:
  # MSIX app: it has no program on PATH, so it is started through its package.
  # Application id "App" read from the installed package manifest (AppxManifest.xml). Starting it this way worked on a real
  # Windows 11 PC; inside the Sandbox the app did not appear (no usable desktop session for MSIX launch), so it is not
  # reproduced there.
  start_appx: { name: Seelen.SeelenUI, app: App }
  # Seelen starts itself at every sign-in through this scheduled task (it runs with the highest privileges, so
  # changing it asks for administrator permission). WinRice owns that switch so the toggle also holds after a restart.
  autostart_task: '\Seelen\Seelen UI Service'
  autostart: false
deactivate:
  # Killing seelen-ui.exe is not enough: slu-service.exe (started by a scheduled task) reopens it
  # within seconds. Stopping the service first lets the UI close for good.
  stop: "slu-service.exe stop"
  remove_autostart: true
conflicts: []
pairs_well_with: []
changes_on_screen:
  - en: "A top bar and a dock appear, and windows can be tiled."
    pt-BR: "Aparecem uma barra no topo e uma dock, e as janelas podem ser organizadas em mosaico."
shortcuts: []
risks:
  en: "It replaces several pieces of the desktop at once, so it can clash with other bars and taskbar mods."
  pt-BR: "Substitui várias partes do desktop de uma vez e pode conflitar com outras barras e mods da barra de tarefas."
how_to_undo:
  en: "Turn off the toggle."
  pt-BR: "Desative no toggle."
